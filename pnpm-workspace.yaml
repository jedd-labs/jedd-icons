packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 1440 # 24 hours
allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  msw: false
  sharp: true
  workerd: true
catalog:
  # Tooling
  "@biomejs/biome": 2.4.15
  "@changesets/cli": ^2.31.1
  "@changesets/changelog-github": ^0.7.0
  turbo: ^2.11.9
  # Pinned: tsx >=4.22.0 breaks `tsdown --config-loader tsx` with
  # "ENOENT: node:fs?tsx-namespace=<uuid>". Introduced by the esbuild 0.28
  # upgrade in 4.22.0 (privatenumber/tsx#789). Unpin once fixed upstream.
  tsx: 4.21.0
  typescript: ^6.0.3
  ultracite: 7.8.1
  lefthook: ^2.2.2

  # Types
  "@types/mdx": ^2.0.14
  "@types/node": ^25.9.9
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # React
  react: ^19.3.1
  react-dom: ^19.3.1

  # Build / bundling
  tsdown: ^0.22.14

  # Vite / Cloudflare
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  "@cloudflare/vite-plugin": ^1.64.0
  wrangler: ^4.151.2

  # Tailwind / styling
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tailwind-merge: ^3.7.0
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # UI libraries
  "@base-ui/react": ^1.9.0
  lucide-react: ^1.60.0
  motion: ^13.5.1
  shadcn: ^4.22.1
  sugar-high: ^2.6.1
  vaul: ^1.1.2

  # Fonts
  "@fontsource-variable/hubot-sans": ^5.3.0

  # Fumadocs
  fumadocs-core: 16.17.7
  fumadocs-mdx: 15.4.8
  fumadocs-ui: 16.17.7

  # TanStack
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-start": 1.169.3

  "@fontsource-variable/figtree": ^5.3.0
  knip: ^6.42.1

  # Icon tooling
  ajv: ^8.20.0

  # Testing
  vitest: ^4.1.12
