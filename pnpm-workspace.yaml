packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 1440 # 24 hours
allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  msw: false
  sharp: true
  workerd: true
catalog:
  # Tooling
  "@biomejs/biome": 2.4.15
  "@changesets/cli": ^2.31.0
  "@changesets/changelog-github": ^0.7.0
  turbo: ^2.10.12
  # Pinned: tsx >=4.22.0 breaks `tsdown --config-loader tsx` with
  # "ENOENT: node:fs?tsx-namespace=<uuid>". Introduced by the esbuild 0.28
  # upgrade in 4.22.0 (privatenumber/tsx#789). Unpin once fixed upstream.
  tsx: 4.21.0
  typescript: ^6.0.3
  ultracite: 7.8.1
  lefthook: ^2.1.12

  # Types
  "@types/mdx": ^2.0.14
  "@types/node": ^25.8.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5

  # React
  react: ^19.2.8
  react-dom: ^19.2.8

  # Build / bundling
  tsdown: ^0.22.14

  # Vite / Cloudflare
  vite: ^8.2.2
  "@vitejs/plugin-react": ^6.1.1
  "@cloudflare/vite-plugin": ^1.54.2
  wrangler: ^4.127.1

  # Tailwind / styling
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # UI libraries
  "@base-ui/react": ^1.7.0
  lucide-react: ^1.37.0
  motion: ^12.38.0
  shadcn: ^4.19.1
  sugar-high: ^1.2.1
  vaul: ^1.1.2

  # Fonts
  "@fontsource-variable/hubot-sans": ^5.3.0
  "@fontsource/iosevka": ^5.3.0

  # Fumadocs
  fumadocs-core: 16.15.4
  fumadocs-mdx: 15.4.0
  fumadocs-ui: 16.15.4

  # TanStack
  "@tanstack/react-router": 1.170.32
  "@tanstack/react-start": 1.168.49

  "@fontsource-variable/figtree": ^5.3.0
  knip: ^6.33.0

  # Testing
  vitest: ^4.1.11
